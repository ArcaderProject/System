name: Build kiosk ISOs

on:
  workflow_dispatch:
    inputs:
      arcader_version:
        description: "Arcader version (e.g. 1.2.2) or 'latest'"
        default: latest
        required: false
      force:
        description: "Rebuild even if a release for this version already exists"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: build-isos
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Arcader version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ github.event.inputs.arcader_version }}"
          if [ -z "$V" ] || [ "$V" = "latest" ]; then
            V="$(gh api repos/ArcaderProject/Arcader/releases/latest --jq .tag_name)"
          fi
          V="${V#v}"
          [ -n "$V" ] || { echo "could not resolve Arcader version" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Arcader version: $V"

      - name: Decide whether to build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists; nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arcader-iso-builder:latest
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}

      - name: Cache live-build packages
        uses: actions/cache@v4
        with:
          path: lb/cache
          key: lb-${{ matrix.arch }}-${{ hashFiles('lb/config/package-lists/**', 'lb/build-iso.sh') }}
          restore-keys: |
            lb-${{ matrix.arch }}-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            .cargo-registry
            installer-gui/target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('installer-gui/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.arch }}-

      - name: Build ISO
        env:
          BUILD_IMAGE: "0"
          ARCADER_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          sudo modprobe loop || true
          ./run.sh ${{ matrix.arch }}
          ls -la out/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: out/arcader-kiosk-${{ matrix.arch }}.iso
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [setup, build]
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: iso-*
          merge-multiple: true
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          ls -la out/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/arcader-kiosk-amd64.iso out/arcader-kiosk-i386.iso --clobber
          else
            gh release create "$TAG" \
              out/arcader-kiosk-amd64.iso out/arcader-kiosk-i386.iso \
              --title "Arcader $TAG" \
              --notes "Kiosk Live ISOs (amd64 + i386) built from Arcader $TAG."
          fi
