[package]
name = "arcader-installer"
version = "0.1.0"
edition = "2021"
description = "Guided graphical installer for the Arcader kiosk system"
license = "GPL-3.0-or-later"

[[bin]]
name = "arcader-installer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.29"
egui-phosphor = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
